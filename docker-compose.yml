services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 956:956
    group_add:
      - 947
    networks:
      - media_net
    restart: 'unless-stopped'
    ports:
      - 8096:8096
    environment:
      - JELLYFIN_CACHE_DIR=/var/cache/jellyfin
      - JELLYFIN_CONFIG_DIR=/etc/jellyfin
      - JELLYFIN_DATA_DIR=/var/lib/jellyfin
      - JELLYFIN_LOG_DIR=/var/log/jellyfin
    volumes:
      - /etc/jellyfin:/etc/jellyfin
      - /var/cache/jellyfin:/var/cache/jellyfin
      - /var/lib/jellyfin:/var/lib/jellyfin
      - /var/log/jellyfin:/var/log/jellyfin
      - /media:/media

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    networks:
      - media_net
    ports:
      - 8080:8080
    environment:
      - PUID=956
      - PGID=947
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8080
    volumes:
      - /srv/docker/configs/qbittorrent:/config
      - /var/lib/qbittorrent/Downloads:/downloads
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    networks:
      - media_net
    ports:
      - 8989:8989
    environment:
      - PUID=956
      - PGID=947
      - TZ=Asia/Kolkata
    volumes:
      - /srv/docker/configs/sonarr:/config
      - /var/lib/qbittorrent/Downloads:/downloads
      - /media/tv:/tv
    restart: unless-stopped

  lidarr:
    image: linuxserver/lidarr
    container_name: lidarr
    networks:
      - media_net
    ports:
      - 8686:8686
    environment:
      - PUID=956
      - PGID=947
      - TZ=Asia/Kolkata
    volumes:
      - /srv/docker/configs/lidarr:/config
      - /var/lib/qbittorrent/Downloads:/downloads
      - /media/music:/music
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr
    container_name: radarr
    networks:
      - media_net
    ports:
      - 7878:7878
    environment:
      - PUID=956
      - PGID=947
      - TZ=Asia/Kolkata
    volumes:
      - /srv/docker/configs/radarr:/config
      - /var/lib/qbittorrent/Downloads:/downloads
      - /media/movies:/movies
    restart: unless-stopped

  prowlarr:
    image: linuxserver/prowlarr
    container_name: prowlarr
    networks:
      - media_net
    ports:
      - 9696:9696
    environment:
      - PUID=956
      - PGID=947
      - TZ=Asia/Kolkata
    volumes:
      - /srv/docker/configs/prowlarr:/config
    restart: unless-stopped

  tor:
    image: dperson/torproxy
    container_name: tor
    networks:
      - media_net
    ports:
      - 9050:9050
    environment:
      - TZ=Asia/Kolkata
    restart: unless-stopped

  jellyseerr:
    image: ghcr.io/fallenbagel/jellyseerr:latest
    init: true
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Asia/Kolkata
      - PORT=5055
    networks:
      - media_net
    ports:
      - 5055:5055
    volumes:
      - /srv/docker/configs/jellyseerr:/app/config
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr
    container_name: flaresolverr
    networks:
      - media_net
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Kolkata
    ports:
      - 8191:8191
    restart: unless-stopped

  dockge:
    image: louislam/dockge:latest
    container_name: dockge
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/dockge/data:/app/data
      - /home/wolf/Dev/Docker:/opt/stacks
    environment:
      - TZ=Asia/Kolkata
    restart: unless-stopped

networks:
  media_net:
    driver: bridge
