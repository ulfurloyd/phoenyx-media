apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: host-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: phoenyxlab.host
      interval: 30s
      rules:
        - alert: NodeDown
          expr: up{job="node-exporter"} == 0
          for: 2m
          labels:
            severity: critical
            category: host
          annotations:
            summary: "Node {{ $labels.instance }} is down"
            description: |
              Prometheus has been unable to scrape node-exporter on
              {{ $labels.instance }} for more than 2 minutes.
        - alert: HighCPUUsage
          expr: |
            (
              100 -
              (
                avg by (instance)
                (
                  rate(node_cpu_seconds_total{mode="idle"}[5m])
                ) * 100
              )
            ) > 90
          for: 5m
          labels:
            severity: warning
            category: host
          annotations:
            summary: "High CPU usage on {{ $labels.instance }}"
            description: |
              CPU utilization on {{ $labels.instance }}
              has been above 90% for 5 minutes.
        - alert: HighMemoryUsage
          expr: |
            (
              1 -
              (
                node_memory_MemAvailable_bytes
                /
                node_memory_MemTotal_bytes
              )
            ) * 100 > 90
          for: 5m
          labels:
            severity: warning
            category: host
          annotations:
            summary: "High memory usage on {{ $labels.instance }}"
            description: |
              Memory utilization on {{ $labels.instance }}
              has been above 90% for 5 minutes.
        - alert: RootFilesystemAlmostFull
          expr: |
            (
              (
                node_filesystem_size_bytes{
                  mountpoint="/",
                  fstype!="tmpfs",
                  fstype!="overlay"
                }
                -
                node_filesystem_avail_bytes{
                  mountpoint="/",
                  fstype!="tmpfs",
                  fstype!="overlay"
                }
              )
              /
              node_filesystem_size_bytes{
                mountpoint="/",
                fstype!="tmpfs",
                fstype!="overlay"
              }
            ) * 100 > 90
          for: 10m
          labels:
            severity: critical
            category: storage
          annotations:
            summary: "Root filesystem almost full on {{ $labels.instance }}"
            description: |
              Root filesystem usage on {{ $labels.instance }}
              has exceeded 90%
