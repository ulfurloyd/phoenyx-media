apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: infra
  labels:
    app: homarr
    app.kubernetes.io/name: homarr
    app.kubernetes.io/instance: homarr
spec:
  replicas: 0
  selector:
    matchLabels:
      app: homarr
  template:
    metadata:
      labels:
        app: homarr
        app.kubernetes.io/name: homarr
        app.kubernetes.io/instance: homarr
    spec:
      containers:
        - name: homarr
          image: ghcr.io/homarr-labs/homarr:v1.68.1
          envFrom:
            - secretRef:
                name: homarr-secret
          ports:
            - containerPort: 7575
          volumeMounts:
            - name: config
              mountPath: /appdata
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homarr-config
