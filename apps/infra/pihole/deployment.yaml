apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: infra
  labels:
    app: pihole
    app.kubernetes.io/name: pihole
    app.kubernetes.io/instance: pihole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
        app.kubernetes.io/name: pihole
        app.kubernetes.io/instance: pihole
    spec:
      containers:
        - name: pihole
          image: pihole/pihole:2026.06.0
          env:
            - name: TZ
              value: "Asia/Kolkata"
            - name: FTLCONF_misc_etc_dnsmasq_d
              value: "true"
          ports:
            - containerPort: 53
              protocol: TCP
            - containerPort: 53
              protocol: UDP
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: pihole
              mountPath: /etc/pihole
              subPath: etc-pihole
            - name: pihole
              mountPath: /etc/dnsmasq.d
              subPath: etc-dnsmasq.d
      volumes:
        - name: pihole
          persistentVolumeClaim:
            claimName: pihole-config
