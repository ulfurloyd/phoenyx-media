apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss-postgres
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freshrss-postgres
  template:
    metadata:
      labels:
        app: freshrss-postgres
        app.kubernetes.io/name: freshrss-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_DB
              value: freshrss
            - name: POSTGRES_USER
              value: freshrss
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freshrss-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: freshrss-postgres
