apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freshrss
  template:
    metadata:
      labels:
        app: freshrss
        app.kubernetes.io/name: freshrss
        app.kubernetes.io/instance: freshrss
    spec:
      containers:
        - name: freshrss
          image: freshrss/freshrss:1.29.1
          env:
            - name: TZ
              value: "Asia/Kolkata"
            - name: CRON_MIN
              value: "20,50"
            - name: BASE_URL
              value: https://freshrss.phoenyxlab.xyz
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: freshrss-secret
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freshrss-secret
                  key: ADMIN_PASSWORD
            - name: DB_HOST
              value: freshrss-postgres
            - name: DB_BASE
              value: freshrss
            - name: DB_USER
              value: freshrss
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freshrss-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /var/www/FreshRSS/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: freshrss-data
