apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinepods-valkey
  namespace: media
  labels:
    app: pinepods-valkey
    app.kubernetes.io/name: pinepods-valkey
    app.kubernetes.io/instance: pinepods-valkey
    app.kubernetes.io/part-of: phoenyxlab
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pinepods-valkey
  template:
    metadata:
      labels:
        app: pinepods-valkey
        app.kubernetes.io/name: pinepods-valkey
        app.kubernetes.io/instance: pinepods-valkey
        app.kubernetes.io/part-of: phoenyxlab
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          ports:
            - containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
