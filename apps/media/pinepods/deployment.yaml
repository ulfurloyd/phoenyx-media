apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinepods
  namespace: media
  labels:
    app: pinepods
    app.kubernetes.io/name: pinepods
    app.kubernetes.io/instance: pinepods
    app.kubernetes.io/part-of: phoenyxlab
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pinepods
  template:
    metadata:
      labels:
        app: pinepods
        app.kubernetes.io/name: pinepods
        app.kubernetes.io/instance: pinepods
        app.kubernetes.io/part-of: phoenyxlab
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: pinepods
          image: madeofpendletonwool/pinepods:0.9.0
          ports:
            - containerPort: 8040
          livenessProbe:
            tcpSocket:
              port: 8040
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8040
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: SEARCH_API_URL
              value: "https://search.pinepods.online/api/search"
            - name: PEOPLE_API_URL
              value: "https:/people.pinepods.online"
            - name: HOSTNAME
              value: "https://pinepods.phoenyxlab.xyz"
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: pinepods-secret
                  key: ADMIN_USERNAME
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pinepods-secret
                  key: ADMIN_PASSWORD
            - name: FULLNAME
              valueFrom:
                secretKeyRef:
                  name: pinepods-secret
                  key: ADMIN_FULLNAME
            - name: EMAIL
              valueFrom:
                secretKeyRef:
                  name: pinepods-secret
                  key: ADMIN_EMAIL
            - name: DB_TYPE
              value: postgresql
            - name: DB_HOST
              value: pinepods-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pinepods-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              value: pinepods_database
            - name: VALKEY_HOST
              value: pinepods-valkey
            - name: VALKEY_PORT
              value: "6379"
            - name: DEBUG_MODE
              value: "false"
            - name: TZ
              value: "Asia/Kolkata"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: data
              mountPath: /opt/pinepods/downloads
              subPath: downloads
            - name: data
              mountPath: /opt/pinepods/backups
              subPath: backups
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pinepods-data
