apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: media
  labels:
    app: navidrome
    app.kubernetes.io/name: navidrome
    app.kubernetes.io/instance: navidrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
        app.kubernetes.io/name: navidrome
        app.kubernetes.io/instance: navidrome
    spec:
      containers:
        - name: navidrome
          image: deluan/navidrome:0.62.0
          ports:
            - containerPort: 4533
          volumeMounts:
            - name: config
              mountPath: /data
            - name: music
              mountPath: /music
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: navidrome-config
        - name: music
          hostPath:
            path: /media/music
