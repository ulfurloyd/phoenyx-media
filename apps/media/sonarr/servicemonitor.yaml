apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sonarr
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - media
  selector:
    matchLabels:
      app: sonarr
  endpoints:
    - port: metrics
      interval: 30s
