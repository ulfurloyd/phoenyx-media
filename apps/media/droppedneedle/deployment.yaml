apiVersion: apps/v1
kind: Deployment
metadata:
  name: droppedneedle
  namespace: media
  labels:
    app: droppedneedle
    app.kubernetes.io/name: droppedneedle
    app.kubernetes.io/instance: droppedneedle
    app.kubernetes.io/part-of: phoenyxlab
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: droppedneedle
  template:
    metadata:
      labels:
        app: droppedneedle
        app.kubernetes.io/name: droppedneedle
        app.kubernetes.io/instance: droppedneedle
        app.kubernetes.io/part-of: phoenyxlab
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: droppedneedle
          image: habirabbu/droppedneedle:v2.11.0
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PORT
              value: "8688"
            - name: TZ
              value: "Asia/Kolkata"
            - name: SLSKD_DOWNLOADS_PATH
              value: "/downloads"
          ports:
            - containerPort: 8688
          livenessProbe:
            tcpSocket:
              port: 8688
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8688
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: cache
              mountPath: /app/cache
            - name: music
              mountPath: /music
            - name: slskd-downloads
              mountPath: /downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: droppedneedle
        - name: cache
          persistentVolumeClaim:
            claimName: droppedneedle-cache
        - name: music
          hostPath:
            path: /media/music
        - name: slskd-downloads
          hostPath:
            path: /downloads/slskd/completed
