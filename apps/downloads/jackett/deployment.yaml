apiVersion: apps/v1
kind: Deployment
metadata:
  name: jackett
  namespace: downloads
  labels:
    app: jackett
    app.kubernetes.io/name: jackett
    app.kubernetes.io/instance: jackett
    app.kubernetes.io/part-of: phoenyxlab
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jackett
  template:
    metadata:
      labels:
        app: jackett
        app.kubernetes.io/name: jackett
        app.kubernetes.io/instance: jackett
        app.kubernetes.io/part-of: phoenyxlab
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: jackett
          image: lscr.io/linuxserver/jackett:0.24.1905
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Kolkata"
          ports:
            - containerPort: 9117
          livenessProbe:
            tcpSocket:
              port: 9117
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 9117
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
      initContainers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
          restartPolicy: Always
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_HTML
              value: "false"
            - name: CAPTCHA_SOLVER
              value: "none"
            - name: TZ
              value: "Asia/Kolkata"
          ports:
            - containerPort: 8191
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jackett-config
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
