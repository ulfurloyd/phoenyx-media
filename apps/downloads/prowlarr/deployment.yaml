apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: downloads
  labels:
    app: prowlarr
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/instance: prowlarr
    app.kubernetes.io/part-of: phoenyxlab
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
        app.kubernetes.io/name: prowlarr
        app.kubernetes.io/instance: prowlarr
        app.kubernetes.io/part-of: phoenyxlab
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.4.0
          ports:
            - containerPort: 9696
          volumeMounts:
            - name: config
              mountPath: /config
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Kolkata"
        - name: exportarr-prowlarr
          image: ghcr.io/onedr0p/exportarr:v2.3.0
          args:
            - prowlarr
          env:
            - name: URL
              value: "http://prowlarr.downloads:9696"
            - name: APIKEY
              valueFrom:
                secretKeyRef:
                  name: prowlarr-secret
                  key: PROWLARR_API_KEY
          ports:
            - containerPort: 9707
              name: metrics
      initContainers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41
          restartPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          envFrom:
            - configMapRef:
                name: gluetun-config
            - secretRef:
                name: gluetun-secret
          volumeMounts:
            - name: tun-device
              mountPath: /dev/net/tun
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
