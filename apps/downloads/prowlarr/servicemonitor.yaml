apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prowlarr
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - downloads
  selector:
    matchLabels:
      app: prowlarr
  endpoints:
    - port: metrics
      interval: 30s
