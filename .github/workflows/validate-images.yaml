name: Validate Images

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for manifest changes
        id: changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only \
              origin/${{ github.base_ref }}...HEAD)
          elif [ "${{ github.event_name }}" = "push" ]; then
            files=$(git diff --name-only \
              ${{ github.event.before }} \
              ${{ github.sha }})
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$files"

          if echo "$files" | grep -qE '^(downloads|infra|media|monitoring)/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate changed image tags
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff_range="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event_name }}" = "push" ]; then
            diff_range="${{ github.event.before }} ${{ github.sha }}"
          else
            echo "Manual run; validating all changed manifests"
            diff_range="HEAD~1 HEAD"
          fi

          images=$(
            git diff -U0 $diff_range \
            | grep '^+' \
            | grep -Po 'image:\s*\K\S+' \
            | sort -u
          )

          if [ -z "$images" ]; then
            echo "No image changes detected."
            exit 0
          fi

          echo "Images to validate:"
          echo "$images"

          while read -r image; do
            [ -z "$image" ] && continue

            echo "::group::$image"
            docker manifest inspect "$image" >/dev/null
            echo "OK"
            echo "::endgroup::"
          done <<< "$images"

          echo
          echo "All images validated successfully."

      - name: Skip validation
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No Kube manifest changes detected."
          echo "Skipping image validation"
