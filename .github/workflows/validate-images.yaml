on:
  pull_request:
    paths:
      - 'downloads/**'
      - 'infra/**'
      - 'media/**'
      - 'monitoring/**'
      - 'monitoring/**'
      - 'configmaps/**'
  push:
    branches:
      - main
    paths:
      - 'downloads/**'
      - 'infra/**'
      - 'media/**'
      - 'monitoring/**'
      - 'monitoring/**'
      - 'configmaps/**'

jobs:
  validate-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate image tags
        run: |
          set -euo pipefail

          images=$(
            grep -RhoP 'image:\s*\K\S+' \
              downloads infra media monitoring |
            sort -u
          )

          echo "Found images:"
          echo "$images"

          while read -r image; do
            [ -z "$image" ] && continue

            echo "::group::$image"
            docker manifest inspect "$image" >/dev/null
            echo "OK"
            echo "::endgroup::"
          done <<< "$images"

          echo
          echo "All images validated successfully."
