apiVersion: apps/v1
kind: Deployment

metadata:
  name: jellyfin
  namespace: media

spec:
  replicas: 1

  selector:
    matchLabels:
      app: jellyfin

  template:
    metadata:
      labels:
        app: jellyfin

    spec:
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest

          ports:
            - containerPort: 8096

          volumeMounts:
            - name: config
              mountPath: /config

            - name: media
              mountPath: /media
              readOnly: true

      volumes:
        - name: config
          hostPath:
            path: /srv/k3s/jellyfin/config

        - name: media
          hostPath:
            path: /srv/media

---

apiVersion: v1
kind: Service

metadata:
  name: jellyfin
  namespace: media

spec:
  selector:
    app: jellyfin

  ports:
    - port: 8096
      targetPort: 8096

  type: ClusterIP

---

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: jellyfin
  namespace: media

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - jellyfin.phoenyxlab.xyz

  rules:
    - host: jellyfin.phoenyxlab.xyz

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
