apiVersion: apps/v1
kind: Deployment

metadata:
  name: radarr
  namespace: media

spec:
  replicas: 1

  selector:
    matchLabels:
      app: radarr

  template:
    metadata:
      labels:
        app: radarr

    spec:
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest

          ports:
            - containerPort: 7878

          env:
            - name: PUID
              value: "1000"

            - name: PGID
              value: "1000"

            - name: TZ
              value: "Asia/Kolkata"

          volumeMounts:
            - name: config
              mountPath: /config

            - name: downloads
              mountPath: /media

            - name: media
              mountPath: /shows

      volumes:
        - name: config
          hostPath:
            path: /srv/k3s/phoenyx-media/radarr/config

        - name: downloads
          hostPath:
            path: /downloads/qbittorrent

        - name: media
          hostPath:
            path: /media/movies

---

apiVersion: v1
kind: Service

metadata:
  name: radarr
  namespace: media

spec:
  selector:
    app: radarr

  ports:
    - port: 7878
      targetPort: 7878

  type: ClusterIP

---

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: radarr
  namespace: media

spec:
  ingressClassName: traefik

  rules:
    - host: radarr.hermes.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: radarr
                port:
                  number: 7878
