apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soulsync-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soulsync
  namespace: media
  labels:
    app: soulsync
    app.kubernetes.io/name: soulsync
    app.kubernetes.io/instance: soulsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soulsync
  template:
    metadata:
      labels:
        app: soulsync
        app.kubernetes.io/name: soulsync
        app.kubernetes.io/instance: soulsync
    spec:
      containers:
        - name: soulsync
          image: boulderbadgedad/soulsync:2.7.7
          ports:
            - containerPort: 8008
          volumeMounts:
            - name: config
              mountPath: /app/config
              subPath: config
            - name: config
              mountPath: /app/logs
              subPath: logs
            - name: config
              mountPath: /app/data
              subPath: data
            - name: downloads
              mountPath: /downloads
            - name: music
              mountPath: /music
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: soulsync-config
        - name: downloads
          hostPath:
            path: /downloads/slskd
        - name: music
          hostPath:
            path: /media/music
---
apiVersion: v1
kind: Service
metadata:
  name: soulsync
  namespace: media
spec:
  selector:
    app: soulsync
  ports:
    - port: 8008
      targetPort: 8008
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soulsync
  namespace: media
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - soulsync.phoenyxlab.xyz
  rules:
    - host: soulsync.phoenyxlab.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: soulsync
                port:
                  number: 8008
