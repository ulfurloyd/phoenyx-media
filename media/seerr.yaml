apiVersion: apps/v1
kind: Deployment

metadata:
  name: seerr
  namespace: media

spec:
  replicas: 1

  selector:
    matchLabels:
      app: seerr

  template:
    metadata:
      labels:
        app: seerr

    spec:
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:latest

          ports:
            - containerPort: 5055

          volumeMounts:
            - name: config
              mountPath: /app/config

      volumes:
        - name: config
          hostPath:
            path: /srv/k3s/seerr/config

---
apiVersion: v1
kind: Service

metadata:
  name: seerr
  namespace: media

spec:
  selector:
    app: seerr

  ports:
    - port: 5055
      targetPort: 5055

  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: seerr
  namespace: media

spec:
  ingressClassName: traefik

  rules:
    - host: seerr.hermes.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: seerr
                port:
                  number: 5055
