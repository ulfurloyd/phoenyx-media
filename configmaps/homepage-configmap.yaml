apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-configmap
  namespace: infra
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: phoenyxlab
    favicon: /images/phoenyx.png
    theme: dark
    color: slate
    background:
      image: /images/PurpleSkullGuy.png
    cardBlur: xl

    showStats: true
    statusStyle: dot

    layout:
      Glances:
        style: row
        columns: 3
        header: false
        headerStyle: boxed
        useEqualHeights: true
      Quick Links:
        style: row
        columns: 5
        header: false
      Dash:
        tab: Dash
        style: row
        columns: 3
        header: false
        headerStyle: boxed
      Core Infrastructure:
        tab: Infrastructure
        style: row
        columns: 3
        header: false
        headerStyle: boxed
        useEqualHeights: true
      Security:
        tab: Infrastructure
        style: row
        columns: 1
        header: false
        headerStyle: boxed
        useEqualHeights: true
      Monitoring:
        tab: Observability
        style: row
        columns: 2
        header: false
        headerStyle: boxed
        useEqualHeights: true
      Media:
        tab: Media
        style: row
        columns: 3
        header: false
        headerStyle: boxed
        useEqualHeights: true
      Arr Stack:
        tab: Media
        style: row
        columns: 4
        header: false
        headerStyle: boxed
        useEqualHeights: true
      Downloads:
        tab: Media
        style: row
        columns: 3
        header: false
        headerStyle: boxed
        useEqualHeights: true

  custom.css: |
    body {
      font-family:
        "Iosevka",
        "JetBrains Mono",
        monospace !important;
    }

  custom.js: ""

  bookmarks.yaml: ""

  services.yaml: |
    - Dash:
      - Agenda:
          widget:
            type: calendar
            firstDayInWeek: monday
            view: agenda
            maxEvents: 10
            showTime: true
            timeZone: Asia/Kolkata
            integrations:
              - type: sonarr
                service_group: Arr Stack
                service_name: Sonarr
              - type: radarr
                service_group: Arr Stack
                service_name: Radarr
              - type: lidarr
                service_group: Arr Stack
                service_name: Lidarr
              - type: ical
                url: "{{HOMEPAGE_VAR_ICAL_PUBLIC_URL}}"
                name: Events

      - Calendar:
          widget:
            type: calendar
            firstDayInWeek: monday
            view: monthly
            maxEvents: 10
            showTime: true
            timeZone: Asia/Kolkata
            integrations:
              - type: sonarr
                service_group: Arr Stack
                service_name: Sonarr
              - type: radarr
                service_group: Arr Stack
                service_name: Radarr
              - type: lidarr
                service_group: Arr Stack
                service_name: Lidarr
              - type: ical
                url: "{{HOMEPAGE_VAR_ICAL_PUBLIC_URL}}"
                name: Events

      - FreshRSS:
          href: https://freshrss.phoenyxlab.xyz
          icon: freshrss
          namespace: media
          app: freshrss
          widget:
            type: freshrss
            url: http://freshrss.media:80
            username: wolf
            password: "{{HOMEPAGE_VAR_FRESHRSS_API_PASSWORD}}"

    - Glances:
        - CPU:
            href: https://glances.phoenyxlab.xyz
            widget:
              type: glances
              url: http://glances.monitoring:61208
              refreshInterval: 10000
              version: 4
              metric: cpu

        - Memory:
            href: https://glances.phoenyxlab.xyz
            widget:
              type: glances
              url: http://glances.monitoring:61208
              refreshInterval: 10000
              version: 4
              metric: memory

        - Disk Usage:
            href: https://glances.phoenyxlab.xyz
            widget:
              type: glances
              url: http://glances.monitoring:61208
              refreshInterval: 10000
              version: 4
              metric: fs:/rootfs

    - Core Infrastructure:
        - Pi-hole:
            href: https://pihole.phoenyxlab.xyz
            icon: pi-hole
            namespace: infra
            app: pihole
            widget:
              type: pihole
              url: http://pihole.infra
              version: 6
              key: "{{HOMEPAGE_VAR_PIHOLE_PASSWD}}"
              fields:
                - queries
                - blocked
                - gravity

        - Traefik:
            href: https://traefik.phoenyxlab.xyz
            icon: traefik
            namespace: kube-system
            app: traefik
            widget:
              type: traefik
              url: https://traefik.phoenyxlab.xyz
              fields:
                - routers
                - services
                - middleware

        - Notifiarr:
            href: https://notifiarr.phoenyxlab.xyz
            icon: notifiarr
            namespace: infra
            app: notifiarr

    - Security:
        - Vaultwarden:
            href: https://vaultwarden.phoenyxlab.xyz
            icon: vaultwarden
            namespace: infra
            app: vaultwarden

    - Monitoring:
        - Uptime Kuma:
            href: https://uptime.phoenyxlab.xyz
            icon: uptime-kuma
            widget:
              type: uptimekuma
              url: https://uptime-internal.phoenyxlab.xyz
              slug: lab
              fields:
                - up
                - down
                - uptime
                - incident

        - Grafana:
            href: https://grafana.phoenyxlab.xyz
            icon: grafana
            namespace: monitoring
            app: grafana
            widget:
              type: grafana
              version: 2
              url: http://kube-prometheus-stack-grafana.monitoring
              username: wolf
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWD}}"
              fields:
                - dashboards
                - alertstriggered

        - Prometheus:
            href: https://prometheus.phoenyxlab.xyz
            icon: prometheus
            namespace: monitoring
            app: prometheus
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring:9090

        - Alertmanager:
            href: https://alertmanager.phoenyxlab.xyz
            icon: alertmanager
            namespace: monitoring
            app: alertmanager

    - Media:
        - Jellyfin:
            href: https://jellyfin.phoenyxlab.xyz
            icon: jellyfin
            namespace: media
            app: jellyfin
            widget:
              type: jellyfin
              url: http://phoenyxfin.media:8096
              key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
              fields:
                - movies
                - series
                - songs
              enableBlocks: true
              enableNowPlaying: false

        - Navidrome:
            href: https://navidrome.phoenyxlab.xyz
            icon: navidrome
            namespace: media
            app: navidrome
            widget:
              type: navidrome
              url: http://navidrome.media:4533
              user: wolf
              salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"
              token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"

        - SoulSync:
            href: https://soulsync.phoenyxlab.xyz
            icon: /images/soulsync.png
            namespace: media
            app: soulsync

    - Arr Stack:
        - Sonarr:
            href: https://sonarr.phoenyxlab.xyz
            icon: sonarr
            namespace: media
            app: sonarr
            widget:
              type: sonarr
              enableQueue: true
              url: http://sonarr.media:8989
              key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"

        - Radarr:
            href: https://radarr.phoenyxlab.xyz
            icon: radarr
            namespace: media
            app: radarr
            widget:
              type: radarr
              enableQueue: true
              url: http://radarr.media:7878
              key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"

        - Lidarr:
            href: https://lidarr.phoenyxlab.xyz
            icon: lidarr
            namespace: media
            app: lidarr
            widget:
              type: lidarr
              url: http://lidarr.media:8686
              key: "{{HOMEPAGE_VAR_LIDARR_API_KEY}}"

        - Seerr:
            href: https://seerr.phoenyxlab.xyz
            icon: seerr
            namespace: media
            app: seerr
            widget:
              type: seerr
              url: http://seerr.media:5055
              key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"

    - Downloads:
        - qBittorrent:
            href: https://qbittorrent.phoenyxlab.xyz
            icon: qbittorrent
            namespace: downloads
            app: qbittorrent
            widget:
              type: qbittorrent
              url: http://qbittorrent.downloads:8080
              username: wolf
              password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWD}}"
              fields:
                - download
                - seed

        - slskd:
            href: https://slskd.phoenyxlab.xyz
            icon: slskd
            namespace: downloads
            app: slskd
            widget:
              type: slskd
              url: http://slskd.downloads:5030
              key: abcd1234
              fields:
                - slskStatus
                - downloads

        - Jackett:
            href: https://jackett.phoenyxlab.xyz
            icon: jackett
            namespace: downloads
            app: jackett
            widget:
              type: jackett
              url: http://jackett.downloads:9117
              password: "{{HOMEPAGE_VAR_JACKETT_PASSWD}}"

    - Quick Links:
        - PhoenyxLab:
            icon: /images/phoenyx.png
            href: https://github.com/ulfurloyd/phoenyxlab

        - Phoenyx:
            icon: /images/phoenyx.png
            href: https://github.com/ulfurloyd/phoenyx

        - Homepage:
            icon: homepage
            href: https://gethomepage.dev/

        - Oracle Cloud:
            icon: oracle-cloud
            href: https://cloud.oracle.com

        - Cloudflare:
            icon: cloudflare
            href: https://dash.cloudflare.com

        - Reddit:
            icon: reddit
            href: https://www.reddit.com/

        - YouTube:
            icon: youtube
            href: https://youtube.com/

        - ProtonMail:
            icon: proton-mail
            href: https://mail.proton.me/

        - GitHub:
            icon: github
            href: https://github.com/

        - Amazon:
            icon: amazon
            href: https://www.amazon.in/

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - search:
        provider: duckduckgo
        target: _blank

    - datetime:
        text_size: x1
        format:
          timeStyle: short
          hourCycle: h23
          hour12: false

  docker.yaml: ""
  proxmox.yaml: ""
