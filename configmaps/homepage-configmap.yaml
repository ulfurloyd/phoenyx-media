apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-configmap
  namespace: infra
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: phoenyxlab
    theme: dark
    layout:
      Infrastructure:
        tab: Infrastructure
      Monitoring:
        tab: Monitoring
      Media:
        tab: Media
      Media Management:
        tab: Media
      Downloads:
        tab: Media
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
  services.yaml: |
    - Infrastructure:
        - Pi-hole:
            href: https://pihole.phoenyxlab.xyz
            icon: pi-hole
            widget:
              type: pihole
              url: http://pihole.infra
              version: 6
              key: "{{HOMEPAGE_VAR_PIHOLE_PASSWD}}"
        - Vaultwarden:
            href: https://vaultwarden.phoenyxlab.xyz
            icon: vaultwarden
        - Notifiarr:
            href: https://notifiarr.phoenyxlab.xyz
            icon: notifiarr
        - Homarr:
            href: https://homarr.phoenyxlab.xyz
            icon: homarr
    - Monitoring:
        - Uptime Kuma:
            href: https://uptime.phoenyxlab.xyz
            icon: uptime-kuma
            widget:
              type: uptimekuma
              url: https://uptime-internal.phoenyxlab.xyz
              slug: lab
        - Grafana:
            href: https://grafana.phoenyxlab.xyz
            icon: grafana
            widget:
              type: grafana
              version: 2
              alerts: alertmanager
              url: http://grafana.monitoring:3000
              username: wolf
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWD}}"
        - Prometheus:
            href: https://prometheus.phoenyxlab.xyz
            icon: prometheus
            widget:
              type: prometheus
              url: http://prometheus.monitoring:9090
        - Alertmanager:
            href: https://alertmanager.phoenyxlab.xyz
    - Media:
        - Jellyfin:
            href: https://jellyfin.phoenyxlab.xyz
            icon: jellyfin
            widget:
              type: jellyfin
              url: http://phoenyxfin.media:8096
              key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
        - Navidrome:
            href: https://navidrome.phoenyxlab.xyz
            icon: navidrome
            widget:
              type: navidrome
              url: http://navidrome.media:4533
              user: wolf
              salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"
              token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
        - SoulSync:
            href: https://soulsync.phoenyxlab.xyz
    - Media Management:
        - Sonarr:
            href: https://sonarr.phoenyxlab.xyz
        - Radarr:
            href: https://radarr.phoenyxlab.xyz
        - Lidarr:
            href: https://lidarr.phoenyxlab.xyz
        - Prowlarr:
            href: https://prowlarr.phoenyxlab.xyz
        - Seerr:
            href: https://seerr.phoenyxlab.xyz
    - Downloads:
        - qBittorrent:
            href: https://qbittorrent.phoenyxlab.xyz
        - Jackett:
            href: https://jackett.phoenyxlab.xyz
        - slskd:
            href: https://slskd.phoenyxlab.xyz
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
