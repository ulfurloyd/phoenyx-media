apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-configmap
  namespace: infra
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: phoenyxlab
    theme: dark
    layout:
      Dashboards:
        tab: Infrastructure
      Core Infrastructure:
        tab: Infrastructure
      Security:
        tab: Infrastructure
      Monitoring:
        tab: Monitoring
      Media:
        tab: Media
      Music:
        tab: Media
      Arr Stack:
        tab: Media
      Downloads:
        tab: Media
  custom.css: |
    :root {
      --background: #0f1115;
      --card-background: #151922;
      --card-background-hover: #1b202b;
      --text: #e8eaed;
      --text-muted: #8b949e;
      --primary: #812be2;
      --primary-hover: #a566d1;
      --border-radius: 10px;
    }
    body {
      font-family:
        "Iosevka",
        "JetBrains Mono",
        monospace !important;
    }
    /* Header */
    header {
      background: #151922 !important;
      border-bottom: 1px solid #4d0b79;
    }
    /* Service cards */
    .service-card,
    .card {
      background: #151922 !important;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .service-card:hover,
    .card:hover {
      border-color: #812be2;
    }
    /* Group titles */
    h2,
    .group-title {
      color: #a566d1 !important;
      font-weight: normal;
    }
    /* Links */
    a:hover {
      color: #a566d1 !important;
    }
    /* Search box */
    input,
    .search-container input {
      background: #151922 !important;
      border: 1px solid #4d0b79 !important;
      color: #e8eaed !important;
    }
    /* Selected text */
    ::selection {
      background: #660ea0;
      color: #ffffff;
    }
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
  services.yaml: |
    - Dashboards:
        - Homarr:
            href: https://homarr.phoenyxlab.xyz
            icon: homarr
    - Core Infrastructure:
        - Pi-hole:
            href: https://pihole.phoenyxlab.xyz
            icon: pi-hole
            widget:
              type: pihole
              url: http://pihole.infra
              version: 6
              key: "{{HOMEPAGE_VAR_PIHOLE_PASSWD}}"
        - Notifiarr:
            href: https://notifiarr.phoenyxlab.xyz
            icon: notifiarr
    - Security:
        - Vaultwarden:
            href: https://vaultwarden.phoenyxlab.xyz
            icon: vaultwarden
    - Monitoring:
        - Uptime Kuma:
            href: https://uptime.phoenyxlab.xyz
            icon: uptime-kuma
            widget:
              type: uptimekuma
              url: https://uptime-internal.phoenyxlab.xyz
              slug: lab
        - Grafana:
            href: https://grafana.phoenyxlab.xyz
            icon: grafana
            widget:
              type: grafana
              version: 2
              url: http://grafana.monitoring:3000
              username: wolf
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWD}}"
        - Prometheus:
            href: https://prometheus.phoenyxlab.xyz
            icon: prometheus
            widget:
              type: prometheus
              url: http://prometheus.monitoring:9090
        - Alertmanager:
            href: https://alertmanager.phoenyxlab.xyz
            icon: alertmanager
    - Media:
        - Jellyfin:
            href: https://jellyfin.phoenyxlab.xyz
            icon: jellyfin
            widget:
              type: jellyfin
              url: http://phoenyxfin.media:8096
              key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
    - Music:
        - Navidrome:
            href: https://navidrome.phoenyxlab.xyz
            icon: navidrome
            widget:
              type: navidrome
              url: http://navidrome.media:4533
              user: wolf
              salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"
              token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
        - SoulSync:
            href: https://soulsync.phoenyxlab.xyz
            icon: soulsync
    - Arr Stack:
        - Sonarr:
            href: https://sonarr.phoenyxlab.xyz
            icon: sonarr
            widget:
              type: sonarr
              url: http://sonarr.media:8989
              key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
        - Radarr:
            href: https://radarr.phoenyxlab.xyz
            icon: radarr
            widget:
              type: radarr
              url: http://radarr.media:7878
              key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
        - Lidarr:
            href: https://lidarr.phoenyxlab.xyz
            icon: lidarr
            widget:
              type: lidarr
              url: http://lidarr.media:8686
              key: "{{HOMEPAGE_VAR_LIDARR_API_KEY}}"
        - Prowlarr:
            href: https://prowlarr.phoenyxlab.xyz
            icon: prowlarr
            widget:
              type: prowlarr
              url: http://prowlarr.downloads:9696
              key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
        - Seerr:
            href: https://seerr.phoenyxlab.xyz
            icon: seerr
            widget:
              type: seerr
              url: http://seerr.media:5055
              key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"
    - Downloads:
        - qBittorrent:
            href: https://qbittorrent.phoenyxlab.xyz
            icon: qbittorrent
            widget:
              type: qbittorrent
              url: http://qbittorrent.downloads:8080
              username: wolf
              password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWD}}"
        - Jackett:
            href: https://jackett.phoenyxlab.xyz
            icon: jackett
            widget:
              type: jackett
              url: http://jackett.downloads:9117
              password: "{{HOMEPAGE_VAR_JACKETT_PASSWD}}"
        - slskd:
            href: https://slskd.phoenyxlab.xyz
            icon: slskd
            widget:
              type: slskd
              url: http://slskd.downloads:5030
              key: abcd1234
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
