apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-configmap
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: discord
      group_wait: 15s
      group_interval: 5m
      repeat_interval: 2h

    receivers:
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/webhook_url
            send_resolved: true
            title: '{{ .CommonAnnotations.summary }}'
            message: '{{ .CommonAnnotations.descriptions }}'
