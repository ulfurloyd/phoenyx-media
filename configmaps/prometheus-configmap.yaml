apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: cadvisor
        static_configs:
          - targets:
              - cadvisor.monitoring:8080
      - job_name: node-exporter
        static_configs:
          - targets:
              - node-exporter.monitoring:9100
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
