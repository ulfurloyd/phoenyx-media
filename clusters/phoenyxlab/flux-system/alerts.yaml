apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-alerts
  namespace: flux-system
spec:
  providerRef:
    name: discord

  eventSeverity: info

  eventSources:
    - kind: GitRepository
      name: flux-system
      namespace: flux-system
    - kind: Kustomization
      name: flux-system
      namespace: flux-system
    - kind: Kustomization
      name: apps
      namespace: flux-system
    - kind: Kustomization
      name: infrastructure
      namespace: flux-system
