apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    alertmanager:
      enabled: true
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - alertmanager.phoenyxlab.xyz
        tls:
          - hosts:
              - alertmanager.phoenyxlab.xyz
    cAdvisor:
      enabled: true
    kubeStateMetrics:
      enabled: true
    grafana:
      enabled: true
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.phoenyxlab.xyz
        tls:
          - hosts:
              - grafana.phoenyxlab.xyz
    prometheus:
      enabled: true
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - prometheus.phoenyxlab.xyz
        tls:
          - hosts:
              - prometheus.phoenyxlab.xyz
    prometheus-node-exporter:
      enabled: true
