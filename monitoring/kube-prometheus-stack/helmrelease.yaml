apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    alertmanager:
      enabled: true
      alertmanagerSpec:
        secrets:
          - alertmanager-secret
      config:
        global: {}
        route:
          receiver: discord
          group_by:
            - alertname
            - severity
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
        receivers:
          - name: discord
            discord_configs:
              - webhook_url_file: /etc/alertmanager/secrets/alertmanager-secret/webhook_url
                send_resolved: true
                title: >-
                  [{{ .Status | toUpper }}]
                  {{ .CommonLabels.alertname }}
                message: |
                  {{ range .Alerts }}
                  **Severity:** {{ .Labels.severity }}
                  **Summary:** {{ .Annotations.summary }}
                  {{ .Annotations.description }}
                  {{ end }}
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - alertmanager.phoenyxlab.xyz
        tls:
          - hosts:
              - alertmanager.phoenyxlab.xyz
    cAdvisor:
      enabled: true
    kubeStateMetrics:
      enabled: true
    grafana:
      enabled: true
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.phoenyxlab.xyz
        tls:
          - hosts:
              - grafana.phoenyxlab.xyz
    prometheus:
      enabled: true
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - prometheus.phoenyxlab.xyz
        tls:
          - hosts:
              - prometheus.phoenyxlab.xyz
    prometheus-node-exporter:
      enabled: true
