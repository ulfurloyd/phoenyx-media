apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring-helm
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    alertmanager:
      enabled: false
    grafana:
      enabled: true
      ingress:
        enabled: true
        ingressClassName: traefik
        tls:
          - hosts:
            - grafana-helm.phoenyxlab.xyz
        rules:
          - host: grafana-helm.phoenyxlab.xyz
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: kube-prometheus-stack-grafana
                      port:
                        number: 3000
    prometheus:
      enabled: true
    kubeStateMetrics:
      enabled: true
    nodeExporter:
      enabled: false
