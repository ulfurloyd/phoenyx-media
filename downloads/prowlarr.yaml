apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: downloads
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.3.5
          ports:
            - containerPort: 9696
          volumeMounts:
            - name: config
              mountPath: /config
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Kolkata"
      initContainers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41
          restartPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          envFrom:
            - configMapRef:
                name: gluetun-config
            - secretRef:
                name: gluetun-secret
          volumeMounts:
            - name: tun-device
              mountPath: /dev/net/tun
      volumes:
        - name: config
          hostPath:
            path: /srv/k3s/phoenyx-media/prowlarr/config
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: downloads
spec:
  selector:
    app: prowlarr
  ports:
    - port: 9696
      targetPort: 9696
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr
  namespace: downloads
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - prowlarr.phoenyxlab.xyz
  rules:
    - host: prowlarr.phoenyxlab.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  number: 9696
