services:
  nicotine:
    image: ghcr.io/fletchto99/nicotine-plus-docker
    container_name: nicotine
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_BASE_PATH}/nicotine:/config
      - /downloads/music/incoming:/downloads
      - /media/music:/music
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
