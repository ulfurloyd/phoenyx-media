services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:nightly
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_BASE_PATH}/lidarr:/config
      - ${MUSIC_LIBRARY_PATH}:/music
      - ${DOWNLOADS_PATH}:/downloads
      - ${SLSKD_DL_PATH}/completed:/slskd
    labels:
      - diun.enable=true
    restart: unless-stopped
    networks:
      - media_net
    depends_on:
      - gluetun
