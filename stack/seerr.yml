services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    volumes:
      - ${CONFIG_BASE_PATH}/seerr:/app/config
    restart: unless-stopped
    networks:
      - media_net
    labels:
      - dynacat.name=Seerr
      - dynacat.icon=sh:seerr
      - dynacat.url=https://seerr.phoenyxlab.duckdns.org
      - dynacat.description=Media Requests
    depends_on:
      - gluetun
