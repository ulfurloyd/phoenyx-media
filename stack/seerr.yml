services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    volumes:
      - ${CONFIG_BASE_PATH}/seerr:/app/config
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
