services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    volumes:
      - ${CONFIG_BASE_PATH}/seerr:/app/config
    restart: unless-stopped
    networks:
      - media_net
    ports:
      - 5055:5055
    depends_on:
      - gluetun
