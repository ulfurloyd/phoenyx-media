services:
  notifiarr:
    image: golift/notifiarr
    container_name: notifiarr
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_BASE_PATH}/notifiarr:/config
      - /var/run/utmp:/var/run/utmp
      - /etc/machine-id:/etc/machine-id
    restart: unless-stopped
    labels:
      - dynacat.name=Notifiarr
      - dynacat.icon=sh:notifiarr
      - dynacat.url=https://notifiarr.phoenyxlab.duckdns.org
      - dynacat.description=Notification Server
    networks:
      - media_net
    depends_on:
      - gluetun
