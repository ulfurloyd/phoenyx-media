services:
  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_BASE_PATH}/sonarr:/config
      - ${SHOWS_LIBRARY_PATH}:/shows
      - ${DOWNLOADS_PATH}:/downloads
    labels:
      - diun.enable=true
      - dynacat.name=Sonarr
      - dynacat.icon=sh:sonarr
      - dynacat.url=https://sonarr.phoenyxlab.duckdns.org
      - dynacat.description=Shows Acquisition
    restart: unless-stopped
    networks:
      - media_net
    depends_on:
      - gluetun
