services:
  jellyseerr:
    image: fallenbagel/jellyseerr
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    volumes:
      - ${CONFIG_BASE_PATH}/jellyseerr:/app/config
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
