services:
  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_BASE_PATH}/radarr:/config
      - ${MOVIES_LIBRARY_PATH}:/movies
      - ${DOWNLOADS_PATH}:/downloads
    restart: unless-stopped
    networks:
      - media_net
    ports:
      - 7878:7878
    depends_on:
      - gluetun
