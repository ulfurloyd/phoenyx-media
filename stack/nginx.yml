services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    environment:
      - TZ=${TZ}
    networks:
      - media_net
    ports:
      - 80:80
      - 81:81
      - 443:443
    volumes:
      - ${CONFIG_BASE_PATH}/nginx:/data
      - ${CONFIG_BASE_PATH}/letsencrypt:/etc/letsencrypt
    labels:
      - dynacat.name=Nginx Proxy Manager
      - dynacat.icon=sh:nginx
      - dynacat.url=https://npm.phoenyxlab.duckdns.org
      - dynacat.description=Reverse Proxy
    restart: unless-stopped
